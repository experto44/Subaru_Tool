name: Build Android APK

# Builds the Subaru Tool Android APK on GitHub's runners (which have the
# Android SDK pre-installed) and publishes it as a downloadable artifact and
# a GitHub Release so it can be installed straight onto a phone.

on:
  push:
    branches:
      - claude/serene-wozniak-j2G28
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK at: $APK"
          cp "$APK" SubaruTool-debug.apk
          echo "path=SubaruTool-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubaruTool-debug-apk
          path: SubaruTool-debug.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Subaru Tool — latest APK
          body: |
            Automatically built debug APK of **Subaru Tool**.

            Download `SubaruTool-debug.apk` below, copy it to your phone, and
            install it (enable "Install unknown apps" for your browser / file
            manager). Open the app and use **Demo mode**, or pair an ELM327
            Bluetooth adapter.
          files: SubaruTool-debug.apk
          make_latest: true
